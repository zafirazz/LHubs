# Application Configuration

app:
  name: "AML Casefile Generation System"
  version: "1.0.0"
  environment: "${ENVIRONMENT:development}"
  debug: "${DEBUG:false}"

# API Configuration
api:
  host: "${API_HOST:0.0.0.0}"
  port: "${API_PORT:8000}"
  workers: "${API_WORKERS:4}"
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"

# Agent Configuration
agents:
  timeout: 300  # seconds
  max_retries: 3
  retry_delay: 5  # seconds
  parallel_execution: true
  max_parallel_agents: 4

# Database Configuration
database:
  postgresql:
    host: "${DB_HOST:localhost}"
    port: "${DB_PORT:5432}"
    user: "${DB_USER:aml_user}"
    password: "${DB_PASSWORD:aml_password}"
    database: "${DB_NAME:aml_casefiles}"
    pool_size: 10
    max_overflow: 20

# Redis Configuration
redis:
  host: "${REDIS_HOST:localhost}"
  port: "${REDIS_PORT:6379}"
  db: 0
  password: "${REDIS_PASSWORD:}"
  decode_responses: true

# Vector Database Configuration
vector_db:
  provider: "chroma"  # or "faiss"
  persist_directory: "./data/vector_db"
  collection_name: "aml_embeddings"

# LLM Configuration (GGUF or Hugging Face Local Model)
llm:
  provider: "huggingface"  # huggingface, openai, anthropic
  model_name: "${LLM_MODEL_NAME:gpt-oss-20b-mxfp4}"  # Model name for reference
  model_path: "${LLM_MODEL_PATH:/Users/zafiraibraeva/Code/lh2025ubs/gpt-oss-20b-mxfp4.gguf}"  # Path to GGUF model file
  device: "${LLM_DEVICE:auto}"  # auto, cpu, cuda, mps
  temperature: 0.1
  max_tokens: 4000
  use_local: true  # Use local model
  trust_remote_code: true
  # For OpenAI/Anthropic (if needed)
  api_key: "${LLM_API_KEY:}"

# File Processing
file_processing:
  upload_dir: "${DATA_DIR:/Users/zafiraibraeva/Code/lh2025ubs/wetransfer_data_lauzhack_v3-zip_2025-11-22_1616/data_lauzhack_fixed}"  # Path to data directory
  processed_dir: "./data/processed"
  output_dir: "./data/outputs"
  max_file_size_mb: 100
  allowed_extensions:
    - ".csv"
    - ".txt"
    - ".pdf"
    - ".xlsx"
    - ".json"

# Workflow Configuration
workflow:
  default_workflow: "default"
  checkpoint_interval: 30  # seconds
  max_workflow_duration: 3600  # seconds

# Logging Configuration
logging:
  level: "${LOG_LEVEL:INFO}"
  format: "json"
  file: "./logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Monitoring
monitoring:
  enabled: true
  prometheus_port: 9090
  health_check_interval: 30

# Security
security:
  secret_key: "${SECRET_KEY:}"
  token_expire_minutes: 1440
  enable_rate_limiting: true
  rate_limit_per_minute: 60

